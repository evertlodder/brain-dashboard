<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f8f9fa; color: #1a1a2e; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const SUPABASE_URL = 'https://fzxpmjvxmpeutwyakgyg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VhBbcWVfAEwbndKUfoZYNg_LmBbQqj0';

const CAT = {
  projects: { color: '#16a34a', bg: '#dcfce7', border: '#bbf7d0' },
  people:   { color: '#2563eb', bg: '#dbeafe', border: '#bfdbfe' },
  admin:    { color: '#d97706', bg: '#fef3c7', border: '#fde68a' },
  idea:     { color: '#7c3aed', bg: '#ede9fe', border: '#ddd6fe' },
};

const today = new Date(); today.setHours(0,0,0,0);

const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : null;
const isToday  = (d) => { if (!d) return false; const dd = new Date(d); dd.setHours(0,0,0,0); return dd.getTime() === today.getTime(); };
const isOverdue = (d) => { if (!d) return false; const dd = new Date(d); dd.setHours(0,0,0,0); return dd < today; };

async function fetchThoughts() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/thoughts?select=id,content,metadata,created_at&order=created_at.desc&limit=100`,
    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
  );
  if (!res.ok) throw new Error(`${res.status} — check Supabase RLS settings`);
  return res.json();
}

function Chip({ cat }) {
  const c = CAT[cat] || CAT.admin;
  return (
    <span style={{
      fontSize: 10, fontWeight: 500, letterSpacing: '0.04em',
      padding: '2px 8px', borderRadius: 4,
      background: c.bg, color: c.color,
      border: `1px solid ${c.border}`,
      fontFamily: 'DM Mono, monospace', textTransform: 'uppercase'
    }}>{cat || 'admin'}</span>
  );
}

function ThoughtCard({ t, onDismiss }) {
  const meta = t.metadata || {};
  const cat = meta.category || 'admin';
  const nudge = meta.nudge_date || meta.due_date;
  const overdue = isOverdue(nudge);
  const todayFlag = isToday(nudge);

  return (
    <div style={{
      background: '#fff',
      border: `1px solid ${overdue ? '#fecaca' : '#e9ecef'}`,
      borderLeft: `3px solid ${overdue ? '#ef4444' : (CAT[cat]||CAT.admin).color}`,
      borderRadius: 8, padding: '12px 14px', marginBottom: 8,
      display: 'flex', gap: 12, alignItems: 'flex-start'
    }}>
      <button onClick={() => onDismiss(t.id)} title="Dismiss" style={{
        width: 18, height: 18, minWidth: 18, borderRadius: '50%',
        border: '1.5px solid #ced4da', background: 'none',
        cursor: 'pointer', marginTop: 2, flexShrink: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 10, color: '#adb5bd'
      }}>✓</button>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, color: '#212529', lineHeight: 1.55, marginBottom: 6 }}>
          {t.content.length > 200 ? t.content.slice(0, 200) + '…' : t.content}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
          <Chip cat={cat} />
          {overdue && (
            <span style={{ fontSize: 10, color: '#dc2626', background: '#fee2e2', border: '1px solid #fecaca', padding: '2px 7px', borderRadius: 4, fontFamily: 'DM Mono', textTransform: 'uppercase', letterSpacing: '0.04em' }}>
              overdue · {fmtDate(nudge)}
            </span>
          )}
          {!overdue && todayFlag && (
            <span style={{ fontSize: 10, color: '#16a34a', background: '#dcfce7', border: '1px solid #bbf7d0', padding: '2px 7px', borderRadius: 4, fontFamily: 'DM Mono', textTransform: 'uppercase', letterSpacing: '0.04em' }}>today</span>
          )}
          {!overdue && !todayFlag && nudge && (
            <span style={{ fontSize: 11, color: '#6c757d', fontFamily: 'DM Mono' }}>{fmtDate(nudge)}</span>
          )}
          <span style={{ fontSize: 11, color: '#adb5bd', marginLeft: 'auto', fontFamily: 'DM Mono' }}>
            {new Date(t.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' })}
          </span>
        </div>
      </div>
    </div>
  );
}

function StatBox({ label, value, color }) {
  return (
    <div style={{
      background: '#fff', border: '1px solid #e9ecef',
      borderRadius: 8, padding: '16px 20px'
    }}>
      <div style={{ fontSize: 28, fontWeight: 600, color: color || '#212529', lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 11, color: '#6c757d', marginTop: 4, textTransform: 'uppercase', letterSpacing: '0.08em', fontFamily: 'DM Mono' }}>{label}</div>
    </div>
  );
}

function App() {
  const [thoughts, setThoughts] = React.useState([]);
  const [dismissed, setDismissed] = React.useState(new Set());
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [view, setView] = React.useState('today');
  const [filter, setFilter] = React.useState('all');

  React.useEffect(() => {
    fetchThoughts()
      .then(d => { setThoughts(d); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  const visible = thoughts.filter(t => !dismissed.has(t.id));
  const dismiss = id => setDismissed(p => new Set([...p, id]));

  const todayItems   = visible.filter(t => isToday(t.metadata?.nudge_date || t.metadata?.due_date));
  const overdueItems = visible.filter(t => isOverdue(t.metadata?.nudge_date || t.metadata?.due_date));
  const recentItems  = visible.slice(0, 40);
  const filteredInbox = filter === 'all' ? recentItems : recentItems.filter(t => (t.metadata?.category || 'admin') === filter);

  const navBtn = (id, label) => (
    <button onClick={() => setView(id)} style={{
      background: view === id ? '#e9ecef' : 'none',
      border: 'none', cursor: 'pointer',
      color: view === id ? '#212529' : '#6c757d',
      fontFamily: 'DM Sans, sans-serif', fontSize: 13, fontWeight: view === id ? 600 : 400,
      padding: '6px 14px', borderRadius: 6
    }}>{label}</button>
  );

  const filterBtn = (id, label) => (
    <button onClick={() => setFilter(id)} style={{
      background: filter === id ? (CAT[id]?.bg || '#e9ecef') : '#fff',
      border: `1px solid ${filter === id ? (CAT[id]?.border || '#ced4da') : '#dee2e6'}`,
      cursor: 'pointer',
      color: filter === id ? (CAT[id]?.color || '#212529') : '#6c757d',
      fontFamily: 'DM Mono, monospace', fontSize: 10,
      letterSpacing: '0.06em', textTransform: 'uppercase',
      padding: '4px 12px', borderRadius: 20, fontWeight: 500
    }}>{label}</button>
  );

  return (
    <div style={{ minHeight: '100vh', background: '#f8f9fa' }}>
      {/* Header */}
      <div style={{
        background: '#fff', borderBottom: '1px solid #e9ecef',
        padding: '0 24px', height: 54,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between'
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: '#212529', letterSpacing: '-0.03em' }}>Brain</span>
          <span style={{ fontSize: 11, color: '#adb5bd', letterSpacing: '0.1em', textTransform: 'uppercase', fontFamily: 'DM Mono' }}>dashboard</span>
        </div>
        <div style={{ display: 'flex', gap: 2 }}>
          {navBtn('today', 'Today')}
          {navBtn('inbox', 'Inbox')}
        </div>
        <div style={{ fontSize: 12, color: '#adb5bd', fontFamily: 'DM Mono' }}>
          {today.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}
        </div>
      </div>

      {/* Content */}
      <div style={{ maxWidth: 800, margin: '0 auto', padding: '24px 20px' }}>

        {loading && <div style={{ textAlign: 'center', color: '#adb5bd', marginTop: 60, fontSize: 13 }}>Loading thoughts…</div>}
        {error   && <div style={{ textAlign: 'center', color: '#dc2626', marginTop: 60, fontSize: 13 }}>Error: {error}</div>}

        {!loading && !error && view === 'today' && (
          <div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12, marginBottom: 28 }}>
              <StatBox label="Due today"  value={todayItems.length}   color="#16a34a" />
              <StatBox label="Overdue"    value={overdueItems.length} color={overdueItems.length > 0 ? '#dc2626' : '#adb5bd'} />
              <StatBox label="In brain"   value={visible.length}      color="#6c757d" />
            </div>

            {overdueItems.length > 0 && (
              <div style={{ marginBottom: 28 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: '#dc2626', letterSpacing: '0.1em', textTransform: 'uppercase', fontFamily: 'DM Mono', marginBottom: 10 }}>⚠ Overdue</div>
                {overdueItems.map(t => <ThoughtCard key={t.id} t={t} onDismiss={dismiss} />)}
              </div>
            )}

            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#6c757d', letterSpacing: '0.1em', textTransform: 'uppercase', fontFamily: 'DM Mono', marginBottom: 10 }}>Today's nudges</div>
              {todayItems.length === 0
                ? <div style={{ color: '#adb5bd', fontSize: 13, padding: '20px 0' }}>Nothing nudged for today.</div>
                : todayItems.map(t => <ThoughtCard key={t.id} t={t} onDismiss={dismiss} />)
              }
            </div>
          </div>
        )}

        {!loading && !error && view === 'inbox' && (
          <div>
            <div style={{ display: 'flex', gap: 6, marginBottom: 18, flexWrap: 'wrap' }}>
              {['all','projects','people','admin','idea'].map(f => filterBtn(f, f))}
            </div>
            {filteredInbox.length === 0
              ? <div style={{ color: '#adb5bd', fontSize: 13 }}>Nothing here.</div>
              : filteredInbox.map(t => <ThoughtCard key={t.id} t={t} onDismiss={dismiss} />)
            }
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
