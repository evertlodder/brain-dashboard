<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain · Graph & Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #94a3b8;
    --subtle: #f1f5f9;
    --canvas-bg: #0f172a;

    --thought: #059669;
    --project: #2563eb;
    --person:  #dc2626;
    --idea:    #d97706;

    --edge-spawn: rgba(99,102,241,0.25);
    --edge-pp:    rgba(245,158,11,0.7);
    --edge-ip:    rgba(167,139,250,0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* HEADER */
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-dot { width:9px; height:9px; border-radius:50%; background:#059669; box-shadow:0 0 6px #059669; animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.75)} }
  .logo h1 { font-size:16px; font-weight:700; letter-spacing:-0.02em; color:var(--text); }
  .logo span { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); }
  .tabs { display:flex; gap:2px; background:var(--subtle); border-radius:8px; padding:3px; }
  .tab { padding:6px 18px; border-radius:6px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; background:transparent; color:var(--muted); transition:all .15s; }
  .tab.active { background:var(--surface); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* CONTENT */
  .content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .panel { display:none; flex:1; flex-direction:column; overflow:hidden; }
  .panel.active { display:flex; }

  /* GRAPH */
  .graph-controls { display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--surface); }
  .filter-label { font-family:'DM Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .chip { padding:3px 10px; border-radius:20px; border:1.5px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:11px; font-weight:600; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:#cbd5e1; color:var(--text); }
  .chip.active-all      { border-color:#6366f1; background:#eef2ff; color:#4f46e5; }
  .chip.active-thought  { border-color:#059669; background:#ecfdf5; color:#059669; }
  .chip.active-project  { border-color:#2563eb; background:#eff6ff; color:#2563eb; }
  .chip.active-person   { border-color:#dc2626; background:#fef2f2; color:#dc2626; }
  .chip.active-idea     { border-color:#d97706; background:#fffbeb; color:#d97706; }
  .chip.active-spawned_from   { border-color:#6366f1; background:#eef2ff; color:#4f46e5; }
  .chip.active-project_person { border-color:#d97706; background:#fffbeb; color:#d97706; }
  .chip.active-idea_project   { border-color:#7c3aed; background:#f5f3ff; color:#7c3aed; }
  .divider { width:1px; height:16px; background:var(--border); margin:0 3px; }
  .stat-badge { margin-left:auto; font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); }

  .graph-wrap { flex:1; position:relative; overflow:hidden; }
  #graph-svg { width:100%; height:100%; display:block; background:var(--canvas-bg); }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:11px; color:#475569; background:var(--canvas-bg); }

  .graph-legend { position:absolute; bottom:12px; left:14px; display:flex; gap:12px; flex-wrap:wrap; }
  .leg-item { display:flex; align-items:center; gap:4px; }
  .leg-dot  { width:7px; height:7px; border-radius:50%; }
  .leg-lbl  { font-family:'DM Mono',monospace; font-size:9px; color:#64748b; }

  /* TOOLTIP */
  #tooltip { position:fixed; pointer-events:none; opacity:0; background:rgba(255,255,255,0.97); border:1px solid var(--border); border-radius:10px; padding:11px 14px; min-width:170px; max-width:230px; transition:opacity .15s; z-index:100; box-shadow:0 4px 16px rgba(0,0,0,.1); }
  #tooltip .t-type  { font-family:'DM Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  #tooltip .t-dot   { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  #tooltip .t-label { font-size:12px; color:var(--text); line-height:1.4; margin-bottom:5px; font-weight:500; }
  #tooltip .t-meta  { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); }

  /* HEALTH */
  .health-inner { padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .health-header { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .health-header .lbl { font-family:'DM Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px; }
  .health-header .val { font-size:12px; color:#475569; }
  .badges { display:flex; gap:6px; }
  .badge { display:flex; align-items:center; gap:5px; border-radius:7px; padding:5px 10px; font-size:11px; font-weight:600; }
  .badge.high   { background:#fef2f2; color:#dc2626; }
  .badge.medium { background:#fffbeb; color:#d97706; }
  .badge .bdot  { width:7px; height:7px; border-radius:50%; }

  .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat-card { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:13px 15px; }
  .stat-card .sc-lbl { font-family:'DM Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  .stat-card .sc-val { font-size:24px; font-weight:700; color:var(--text); line-height:1; }
  .stat-card .sc-bar { margin-top:7px; height:2px; border-radius:1px; }

  .lint-section h3 { font-family:'DM Mono',monospace; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .lint-item { border-radius:10px; padding:12px 14px; display:flex; gap:10px; margin-bottom:6px; }
  .lint-item .li-dot   { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:3px; }
  .lint-item .li-body  { flex:1; }
  .lint-item .li-top   { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .lint-item .li-label { font-size:12px; font-weight:600; }
  .lint-item .li-count { font-family:'DM Mono',monospace; font-size:10px; padding:1px 5px; border-radius:4px; background:rgba(0,0,0,.06); }
  .lint-item .li-desc  { font-size:11px; opacity:.75; line-height:1.5; }
  .lint-item.high   { background:#fef2f2; } .lint-item.high   .li-label,.lint-item.high   .li-count,.lint-item.high   .li-desc,.lint-item.high   .li-dot { color:#dc2626; } .lint-item.high   .li-dot { background:#ef4444; color:transparent; }
  .lint-item.medium { background:#fffbeb; } .lint-item.medium .li-label,.lint-item.medium .li-count,.lint-item.medium .li-desc,.lint-item.medium .li-dot { color:#d97706; } .lint-item.medium .li-dot { background:#f59e0b; color:transparent; }
  .lint-item.low    { background:#eff6ff; } .lint-item.low    .li-label,.lint-item.low    .li-count,.lint-item.low    .li-desc,.lint-item.low    .li-dot { color:#2563eb; } .lint-item.low    .li-dot { background:#3b82f6; color:transparent; }
  .lint-item.info   { background:#f0fdf4; } .lint-item.info   .li-label,.lint-item.info   .li-count,.lint-item.info   .li-desc,.lint-item.info   .li-dot { color:#16a34a; } .lint-item.info   .li-dot { background:#22c55e; color:transparent; }
  .empty-state { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); text-align:center; padding:40px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <h1>Open Brain</h1>
      <span>fzxpmjvx · graph & health</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('graph')">Graph</button>
    <button class="tab" onclick="switchTab('health')">Health</button>
  </div>
</header>

<div class="content">
  <!-- GRAPH -->
  <div class="panel active" id="panel-graph">
    <div class="graph-controls">
      <span class="filter-label">Nodes</span>
      <button class="chip active-all" data-nf="all"     onclick="setNodeFilter(this)">Alles</button>
      <button class="chip" data-nf="thought"  onclick="setNodeFilter(this)">Thoughts</button>
      <button class="chip" data-nf="project"  onclick="setNodeFilter(this)">Projects</button>
      <button class="chip" data-nf="person"   onclick="setNodeFilter(this)">People</button>
      <button class="chip" data-nf="idea"     onclick="setNodeFilter(this)">Ideas</button>
      <div class="divider"></div>
      <span class="filter-label">Edges</span>
      <button class="chip active-all" data-ef="all"            onclick="setEdgeFilter(this)">Alle</button>
      <button class="chip" data-ef="spawned_from"   onclick="setEdgeFilter(this)">spawned→</button>
      <button class="chip" data-ef="project_person" onclick="setEdgeFilter(this)">project→person</button>
      <button class="chip" data-ef="idea_project"   onclick="setEdgeFilter(this)">idea→project</button>
      <span class="stat-badge" id="graph-stats">laden…</span>
    </div>
    <div class="graph-wrap">
      <div id="loading">kennisgraaf laden…</div>
      <svg id="graph-svg"></svg>
      <div class="graph-legend">
        <div class="leg-item"><div class="leg-dot" style="background:#6EE7B7"></div><span class="leg-lbl">thought</span></div>
        <div class="leg-item"><div class="leg-dot" style="background:#93C5FD"></div><span class="leg-lbl">project</span></div>
        <div class="leg-item"><div class="leg-dot" style="background:#FCA5A5"></div><span class="leg-lbl">person</span></div>
        <div class="leg-item"><div class="leg-dot" style="background:#FCD34D"></div><span class="leg-lbl">idea</span></div>
      </div>
    </div>
  </div>

  <!-- HEALTH -->
  <div class="panel" id="panel-health">
    <div class="health-inner">
      <div class="health-header">
        <div>
          <div class="lbl">Laatste lint run</div>
          <div class="val" id="last-run">laden…</div>
        </div>
        <div class="badges" id="lint-badges"></div>
      </div>
      <div class="stats-grid" id="stats-grid"></div>
      <div class="lint-section">
        <h3>Bevindingen</h3>
        <div id="lint-list"><div class="empty-state">laden…</div></div>
      </div>
    </div>
  </div>
</div>

<div id="tooltip">
  <div class="t-type"><div class="t-dot" id="t-dot"></div><span id="t-type"></span></div>
  <div class="t-label" id="t-label"></div>
  <div class="t-meta"  id="t-meta"></div>
</div>

<script>
const SB_URL  = 'https://fzxpmjvxmpeutwyakgyg.supabase.co/rest/v1';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eHBtanZ4bXBldXR3eWFrZ3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2OTAwMDEsImV4cCI6MjA4ODI2NjAwMX0.9rOfzwv6wImlsIrzXaLiZ6ueygAZ4KYYDMtoOtDjPT8';
const HDR = { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}` };

const NODE_COLOR = { thought:'#6EE7B7', project:'#93C5FD', person:'#FCA5A5', idea:'#FCD34D' };
const EDGE_COLOR = { spawned_from:'rgba(99,102,241,0.3)', project_person:'rgba(245,158,11,0.8)', idea_project:'rgba(167,139,250,0.8)' };
const NODE_R     = { thought:5, project:10, person:8, idea:7 };

let ALL_NODES=[], ALL_EDGES=[], nodeFilter='all', edgeFilter='all';

async function sb(path, qs='') {
  const r = await fetch(`${SB_URL}/${path}${qs}`, { headers: HDR });
  const d = await r.json();
  return Array.isArray(d) ? d : [];
}

// Use limit-based count (RLS-safe with anon key)
async function sbCount(path, qs='') {
  const r = await fetch(`${SB_URL}/${path}?select=id${qs}&limit=10000`, { headers: HDR });
  const d = await r.json();
  return Array.isArray(d) ? d.length : 0;
}

function switchTab(id) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>{ if(t.textContent.toLowerCase().startsWith(id[0])) t.classList.add('active'); });
  if(id==='graph') resizeGraph();
  if(id==='health') loadHealth();
}

// ── GRAPH ──
async function loadGraph() {
  const [projects,people,ideas,rels,derived] = await Promise.all([
    sb('projects','?select=id,name,status,entity&limit=80'),
    sb('people','?select=id,name,company&limit=50'),
    sb('ideas','?select=id,title,status&limit=50'),
    sb('relations','?select=source_id,source_type,target_id,target_type,relation_type&limit=600'),
    sb('derived_edges','?select=source_id,source_type,target_id,target_type,edge_type,weight&limit=200'),
  ]);

  const linkedIds = new Set([...rels.map(r=>r.source_id),...rels.map(r=>r.target_id),...derived.map(d=>d.source_id),...derived.map(d=>d.target_id)]);
  const tIds = [...new Set(rels.filter(r=>r.source_type==='thought').map(r=>r.source_id))].slice(0,80);
  const thoughts = tIds.length ? await sb('thoughts',`?id=in.(${tIds.join(',')})&select=id,title,category`) : [];

  ALL_NODES = [
    ...thoughts.map(t=>({id:t.id,type:'thought',label:t.title||'–',sub:t.category})),
    ...projects.map(p=>({id:p.id,type:'project',label:p.name,sub:p.entity||p.status})),
    ...people.map(p=>({id:p.id,type:'person',label:p.name,sub:p.company})),
    ...ideas.map(i=>({id:i.id,type:'idea',label:i.title,sub:i.status})),
  ].filter(n=>linkedIds.has(n.id)||n.type==='project'||n.type==='person');

  const nIds = new Set(ALL_NODES.map(n=>n.id));
  ALL_EDGES = [
    ...rels.filter(r=>nIds.has(r.source_id)&&nIds.has(r.target_id)).map(r=>({source:r.source_id,target:r.target_id,type:r.relation_type,derived:false})),
    ...derived.filter(d=>nIds.has(d.source_id)&&nIds.has(d.target_id)).map(d=>({source:d.source_id,target:d.target_id,type:d.edge_type,weight:d.weight,derived:true})),
  ];

  document.getElementById('loading').style.display='none';
  buildGraph();
}

let W=0,H=0,simulation;
function buildGraph() {
  const el=document.getElementById('graph-svg');
  W=el.clientWidth; H=el.clientHeight;
  d3.select(el).selectAll('*').remove();

  const nodes=nodeFilter==='all'?ALL_NODES:ALL_NODES.filter(n=>n.type===nodeFilter);
  const ids=new Set(nodes.map(n=>n.id));
  const edges=ALL_EDGES.filter(e=>ids.has(e.source)&&ids.has(e.target)&&(edgeFilter==='all'||e.type===edgeFilter));
  document.getElementById('graph-stats').textContent=`${nodes.length} nodes · ${edges.length} edges`;

  const svg=d3.select(el).attr('width',W).attr('height',H)
    .call(d3.zoom().scaleExtent([0.2,5]).on('zoom',e=>g.attr('transform',e.transform)));
  const g=svg.append('g');

  svg.append('defs').append('marker').attr('id','arr').attr('viewBox','0 -3 6 6').attr('refX',6).attr('refY',0).attr('markerWidth',4).attr('markerHeight',4).attr('orient','auto')
    .append('path').attr('d','M0,-3L6,0L0,3').attr('fill','#334155');

  simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>d.derived?110:70).strength(0.4))
    .force('charge',d3.forceManyBody().strength(-180))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>NODE_R[d.type]+8));

  const link=g.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',d=>EDGE_COLOR[d.type]||'rgba(99,102,241,0.25)')
    .attr('stroke-width',d=>d.derived?1.5:0.8)
    .attr('stroke-dasharray',d=>d.derived?'4 3':null)
    .attr('marker-end','url(#arr)');

  const node=g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',  (e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('mouseover',showTT).on('mousemove',moveTT).on('mouseout',hideTT);

  node.append('circle').attr('r',d=>NODE_R[d.type]||5).attr('fill',d=>NODE_COLOR[d.type]||'#94a3b8')
    .attr('fill-opacity',0.9).attr('stroke','#0f172a').attr('stroke-width',1.5);

  node.filter(d=>d.type==='project'||d.type==='person').append('text')
    .attr('dy',d=>-(NODE_R[d.type]||5)-5).attr('text-anchor','middle')
    .attr('fill','#94a3b8').attr('font-size',9).attr('font-family','DM Sans,sans-serif')
    .attr('pointer-events','none').attr('user-select','none')
    .text(d=>(d.label||'').length>22?d.label.slice(0,22)+'…':d.label);

  simulation.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function resizeGraph(){
  const el=document.getElementById('graph-svg');
  if(el.clientWidth!==W||el.clientHeight!==H){W=el.clientWidth;H=el.clientHeight;if(ALL_NODES.length)buildGraph();}
}
window.addEventListener('resize',resizeGraph);

function setNodeFilter(btn){
  nodeFilter=btn.dataset.nf;
  document.querySelectorAll('[data-nf]').forEach(b=>b.className='chip'+(b===btn?` active-${nodeFilter}`:''));
  if(ALL_NODES.length)buildGraph();
}
function setEdgeFilter(btn){
  edgeFilter=btn.dataset.ef;
  document.querySelectorAll('[data-ef]').forEach(b=>b.className='chip'+(b===btn?` active-${edgeFilter}`:''));
  if(ALL_NODES.length)buildGraph();
}

const tt=document.getElementById('tooltip');
function showTT(e,d){
  document.getElementById('t-dot').style.background=NODE_COLOR[d.type]||'#94a3b8';
  document.getElementById('t-type').textContent=d.type;
  document.getElementById('t-label').textContent=d.label;
  document.getElementById('t-meta').textContent=d.sub||'';
  tt.style.opacity=1; moveTT(e);
}
function moveTT(e){tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function hideTT(){tt.style.opacity=0;}

// ── HEALTH ──
let healthLoaded=false;
async function loadHealth(){
  if(healthLoaded)return;
  healthLoaded=true;

  const [lintRows,tc,pc,pec,ic,rc,dc]=await Promise.all([
    sb('brain_lint_results','?order=run_at.desc&limit=30'),
    sbCount('thoughts'),
    sbCount('projects'),
    sbCount('people'),
    sbCount('ideas'),
    sbCount('relations'),
    sbCount('derived_edges'),
  ]);

  const STATS=[['Thoughts',tc,'#059669'],['Projects',pc,'#2563eb'],['People',pec,'#dc2626'],['Ideas',ic,'#d97706'],['Relaties',rc,'#7c3aed'],['Derived',dc,'#f59e0b']];
  document.getElementById('stats-grid').innerHTML=STATS.map(([l,v,c])=>`
    <div class="stat-card">
      <div class="sc-lbl">${l}</div>
      <div class="sc-val">${v.toLocaleString('nl-NL')}</div>
      <div class="sc-bar" style="background:${c}"></div>
    </div>`).join('');

  if(!lintRows.length){document.getElementById('last-run').textContent='Nog geen run';return;}
  const latest=lintRows[0].run_at;
  const items=lintRows.filter(l=>l.run_at===latest).sort((a,b)=>({high:0,medium:1,low:2,info:3}[a.severity]-{high:0,medium:1,low:2,info:3}[b.severity]));
  document.getElementById('last-run').textContent=new Date(latest).toLocaleString('nl-NL');

  const high=items.filter(i=>i.severity==='high').length;
  const med=items.filter(i=>i.severity==='medium').length;
  let badges='';
  if(high) badges+=`<div class="badge high"><div class="bdot" style="background:#ef4444"></div>${high} hoog</div>`;
  if(med)  badges+=`<div class="badge medium"><div class="bdot" style="background:#f59e0b"></div>${med} medium</div>`;
  document.getElementById('lint-badges').innerHTML=badges;

  document.getElementById('lint-list').innerHTML=items.map(item=>`
    <div class="lint-item ${item.severity}">
      <div class="li-dot"></div>
      <div class="li-body">
        <div class="li-top">
          <span class="li-label">${item.label}</span>
          <span class="li-count">${(item.count||0).toLocaleString('nl-NL')}</span>
        </div>
        <div class="li-desc">${item.description||''}</div>
      </div>
    </div>`).join('');
}

loadGraph();
</script>
</body>
</html>
