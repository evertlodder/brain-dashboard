<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain · Graph & Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f8fafc;color:#0f172a}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 5px #16a34a;animation:pu 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
.logo h1{font-size:14px;font-weight:700;letter-spacing:-.02em}
.logo small{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8}
.tabs{display:flex;gap:2px;background:#f1f5f9;border-radius:7px;padding:2px;flex-shrink:0}
.tab{padding:5px 14px;border-radius:5px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;color:#94a3b8;transition:all .15s}
.tab.on{background:#fff;color:#0f172a;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.searchbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.search-wrap{position:relative;flex:1;max-width:320px}
.searchbar input{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:12px;color:#0f172a;outline:none;transition:border-color .15s}
.searchbar input:focus{border-color:#6366f1}
.searchbar input::placeholder{color:#94a3b8}
#searchresults{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:300;max-height:240px;overflow-y:auto;display:none}
.sr-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f1f5f9;transition:background .1s}
.sr-item:hover{background:#f8fafc}
.sr-item:last-child{border-bottom:none}
.sr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sr-lbl{font-size:12px;color:#0f172a;font-weight:500}
.sr-sub{font-size:10px;color:#94a3b8;font-family:'DM Mono',monospace}
.gc{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.fl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.chip{padding:2px 8px;border-radius:20px;border:1.5px solid #e2e8f0;background:transparent;color:#94a3b8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.an{border-color:#6366f1;background:#eef2ff;color:#4338ca}
.at{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.apr{border-color:#2563eb;background:#eff6ff;color:#2563eb}
.ape{border-color:#dc2626;background:#fef2f2;color:#dc2626}
.ai{border-color:#d97706;background:#fffbeb;color:#d97706}
.aef{border-color:#6366f1;background:#eef2ff;color:#4338ca}
.app{border-color:#d97706;background:#fffbeb;color:#d97706}
.aip{border-color:#7c3aed;background:#f5f3ff;color:#7c3aed}
.sep{width:1px;height:12px;background:#e2e8f0}
.sb{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:#94a3b8}
.content{flex:1;display:flex;flex-direction:column;min-height:0}
.panel{display:none;flex:1;flex-direction:column;min-height:0}
.panel.on{display:flex}
.graph-body{flex:1;display:flex;min-height:0;position:relative}
.gw{flex:1;position:relative;min-height:0}
#gs{position:absolute;inset:0;width:100%;height:100%;background:#0f172a}
#gloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:'DM Mono',monospace;font-size:11px;color:#475569;z-index:10}
.legend{position:absolute;bottom:10px;left:12px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.li2{display:flex;align-items:center;gap:4px}
.ld{width:6px;height:6px;border-radius:50%}
.ll{font-family:'DM Mono',monospace;font-size:9px;color:#64748b}
#detail{position:absolute;top:0;right:0;width:300px;height:100%;background:#fff;border-left:1px solid #e2e8f0;transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column;overflow:hidden}
#detail.open{transform:translateX(0)}
.dp-header{padding:14px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0}
.dp-close{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;line-height:1;padding:0;flex-shrink:0}
.dp-type{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.dp-typedot{width:7px;height:7px;border-radius:50%}
.dp-title{font-size:14px;font-weight:600;color:#0f172a;line-height:1.35}
.dp-sub{font-family:'DM Mono',monospace;font-size:10px;color:#94a3b8;margin-top:3px}
.dp-body{flex:1;overflow-y:auto;padding:14px 16px}
.dp-section{margin-bottom:16px}
.dp-seclbl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.dp-conn{display:flex;flex-direction:column;gap:4px}
.dp-connitem{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;background:#f8fafc;cursor:pointer;transition:background .12s;border:1px solid #f1f5f9}
.dp-connitem:hover{background:#f1f5f9}
.dp-conndot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dp-connlbl{font-size:11px;color:#0f172a;line-height:1.3}
.dp-connsub{font-size:10px;color:#94a3b8;font-family:'DM Mono',monospace}
.dp-empty{font-size:11px;color:#94a3b8;font-style:italic}
#panel-health{overflow-y:auto}
.hi{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.hh{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.hv{font-size:12px;color:#475569}
.bgs{display:flex;gap:5px}
.bg{display:flex;align-items:center;gap:4px;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600}
.bgh{background:#fef2f2;color:#dc2626}
.bgm{background:#fffbeb;color:#d97706}
.bd{width:6px;height:6px;border-radius:50%}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc{background:#fff;border:1.5px solid #e2e8f0;border-radius:8px;padding:11px 13px}
.scl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.scv{font-size:20px;font-weight:700;color:#0f172a;line-height:1}
.scb{margin-top:5px;height:2px;border-radius:1px}
.lsh{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.litem{border-radius:8px;padding:10px 12px;display:flex;gap:8px;margin-bottom:5px}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lb{flex:1}
.lt{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.llab{font-size:12px;font-weight:600}
.lcnt{font-family:'DM Mono',monospace;font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.06)}
.ldesc{font-size:11px;opacity:.75;line-height:1.5}
.litem.high{background:#fef2f2}.litem.high .llab,.litem.high .lcnt,.litem.high .ldesc{color:#dc2626}.litem.high .ldot{background:#ef4444}
.litem.medium{background:#fffbeb}.litem.medium .llab,.litem.medium .lcnt,.litem.medium .ldesc{color:#d97706}.litem.medium .ldot{background:#f59e0b}
.litem.low{background:#eff6ff}.litem.low .llab,.litem.low .lcnt,.litem.low .ldesc{color:#2563eb}.litem.low .ldot{background:#3b82f6}
.litem.info{background:#f0fdf4}.litem.info .llab,.litem.info .lcnt,.litem.info .ldesc{color:#16a34a}.litem.info .ldot{background:#22c55e}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div><div><h1>Open Brain</h1><small>fzxpmjvx · graph & health</small></div></div>
  <div class="tabs">
    <button class="tab on" onclick="sw('graph',this)">Graph</button>
    <button class="tab"    onclick="sw('health',this)">Health</button>
  </div>
</header>
<div class="content">
  <div class="panel on" id="panel-graph">
    <div class="searchbar">
      <div class="search-wrap">
        <input type="text" id="searchinput" placeholder="Zoek node…" oninput="onSearch(this.value)" onblur="setTimeout(()=>hideSearch(),200)">
        <div id="searchresults"></div>
      </div>
    </div>
    <div class="gc">
      <span class="fl">Nodes</span>
      <button class="chip an"  data-nf="all"     onclick="sNF(this)">Alles</button>
      <button class="chip"     data-nf="thought" onclick="sNF(this)">Thoughts</button>
      <button class="chip"     data-nf="project" onclick="sNF(this)">Projects</button>
      <button class="chip"     data-nf="person"  onclick="sNF(this)">People</button>
      <button class="chip"     data-nf="idea"    onclick="sNF(this)">Ideas</button>
      <div class="sep"></div>
      <span class="fl">Edges</span>
      <button class="chip aef" data-ef="all"            onclick="sEF(this)">Alle</button>
      <button class="chip"     data-ef="spawned_from"   onclick="sEF(this)">spawned→</button>
      <button class="chip"     data-ef="project_person" onclick="sEF(this)">proj→person</button>
      <button class="chip"     data-ef="idea_project"   onclick="sEF(this)">idea→proj</button>
      <span class="sb" id="gstat">laden…</span>
    </div>
    <div class="graph-body">
      <div class="gw">
        <div id="gloading">kennisgraaf laden…</div>
        <svg id="gs"></svg>
        <div class="legend">
          <div class="li2"><div class="ld" style="background:#6EE7B7"></div><span class="ll">thought</span></div>
          <div class="li2"><div class="ld" style="background:#93C5FD"></div><span class="ll">project</span></div>
          <div class="li2"><div class="ld" style="background:#FCA5A5"></div><span class="ll">person</span></div>
          <div class="li2"><div class="ld" style="background:#FCD34D"></div><span class="ll">idea</span></div>
        </div>
      </div>
      <div id="detail">
        <div class="dp-header">
          <div>
            <div class="dp-type"><div class="dp-typedot" id="dp-dot"></div><span id="dp-type"></span></div>
            <div class="dp-title" id="dp-title"></div>
            <div class="dp-sub"   id="dp-sub"></div>
          </div>
          <button class="dp-close" onclick="closeDetail()">✕</button>
        </div>
        <div class="dp-body" id="dp-body"></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel-health">
    <div class="hi">
      <div class="hh">
        <div><div class="hl">Laatste lint run</div><div class="hv" id="lr">laden…</div></div>
        <div class="bgs" id="lbg"></div>
      </div>
      <div class="sg" id="sg"></div>
      <div><div class="lsh">Bevindingen</div><div id="ll">laden…</div></div>
    </div>
  </div>
</div>
<script>
// Key wordt geïnjecteerd door Cloudflare Pages Function via window.SB_KEY
// Fallback: leeg (werkt niet zonder key)
const SB  = 'https://fzxpmjvxmpeutwyakgyg.supabase.co';
const KEY = window.SB_KEY || 'sb_publishable_VhBbcWVfAEwbndKUfoZYNg_LmBbQqj0';

async function sbGet(table, qs=''){
  const sep = qs.includes('?') ? '&' : '?';
  const r = await fetch(`${SB}/rest/v1/${table}${qs}${sep}apikey=${KEY}`);
  if(!r.ok) return [];
  const d = await r.json();
  return Array.isArray(d) ? d : [];
}
async function sbCnt(table, qs=''){
  const d = await sbGet(table, `?select=id${qs}&limit=5000`);
  return d.length;
}

const NC={thought:'#6EE7B7',project:'#93C5FD',person:'#FCA5A5',idea:'#FCD34D'};
const EC={spawned_from:'rgba(99,102,241,.35)',project_person:'rgba(245,158,11,.9)',idea_project:'rgba(167,139,250,.9)'};
const NR={thought:5,project:10,person:8,idea:7};
const NCL={all:'an',thought:'at',project:'apr',person:'ape',idea:'ai'};
const ECL={all:'aef',spawned_from:'aef',project_person:'app',idea_project:'aip'};
let RAW_NODES=[],RAW_EDGES=[],nodeById={},nf='all',ef='all',sim;

function sw(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='graph') setTimeout(buildG,60);
  if(id==='health') loadH();
}

async function loadGraph(){
  const [pr,pe,id,rl,dv]=await Promise.all([
    sbGet('projects','?select=id,name,status,entity&limit=100'),
    sbGet('people',  '?select=id,name,company,role&limit=60'),
    sbGet('ideas',   '?select=id,title,status,category&limit=60'),
    sbGet('relations','?select=source_id,source_type,target_id,target_type,relation_type&limit=800'),
    sbGet('derived_edges','?select=source_id,source_type,target_id,target_type,edge_type&limit=300'),
  ]);
  const lids=new Set([...rl.map(r=>r.source_id),...rl.map(r=>r.target_id),...dv.map(d=>d.source_id),...dv.map(d=>d.target_id)]);
  const tids=[...new Set(rl.filter(r=>r.source_type==='thought').map(r=>r.source_id))].slice(0,80);
  const th=tids.length?await sbGet('thoughts',`?id=in.(${tids.join(',')})&select=id,title,category,content`):[];
  window._maps={
    peopleMap:Object.fromEntries(pe.map(p=>[p.id,p])),
    projectMap:Object.fromEntries(pr.map(p=>[p.id,p])),
    ideaMap:Object.fromEntries(id.map(i=>[i.id,i])),
    thoughtMap:Object.fromEntries(th.map(t=>[t.id,t])),
  };
  window._rl=rl; window._dv=dv;
  RAW_NODES=[
    ...th.map(t=>({id:t.id,type:'thought',label:t.title||'–',sub:t.category})),
    ...pr.map(p=>({id:p.id,type:'project',label:p.name,sub:p.entity||p.status})),
    ...pe.map(p=>({id:p.id,type:'person', label:p.name,sub:p.company||p.role})),
    ...id.map(i=>({id:i.id,type:'idea',  label:i.title,sub:i.status})),
  ].filter(n=>lids.has(n.id)||n.type==='project'||n.type==='person');
  const nids=new Set(RAW_NODES.map(n=>n.id));
  RAW_EDGES=[
    ...rl.filter(r=>nids.has(r.source_id)&&nids.has(r.target_id)).map(r=>({sid:r.source_id,tid:r.target_id,type:r.relation_type,derived:false})),
    ...dv.filter(d=>nids.has(d.source_id)&&nids.has(d.target_id)).map(d=>({sid:d.source_id,tid:d.target_id,type:d.edge_type,derived:true})),
  ];
  document.getElementById('gloading').style.display='none';
  buildG();
}

function buildG(){
  const el=document.getElementById('gs');
  const W=el.clientWidth,H=el.clientHeight;
  if(!W||!H){setTimeout(buildG,150);return;}
  if(sim)sim.stop();
  d3.select(el).selectAll('*').remove();
  nodeById={};
  const nodes=(nf==='all'?RAW_NODES:RAW_NODES.filter(n=>n.type===nf)).map(n=>({...n}));
  nodes.forEach(n=>nodeById[n.id]=n);
  const edges=RAW_EDGES.filter(e=>nodeById[e.sid]&&nodeById[e.tid]&&(ef==='all'||e.type===ef))
    .map(e=>({source:nodeById[e.sid],target:nodeById[e.tid],type:e.type,derived:e.derived}));
  document.getElementById('gstat').textContent=`${nodes.length} nodes · ${edges.length} edges`;
  const root=d3.select(el);
  const g=root.append('g');
  root.call(d3.zoom().scaleExtent([0.1,10]).on('zoom',e=>g.attr('transform',e.transform)));
  root.append('defs').append('marker').attr('id','arr').attr('viewBox','0 -3 6 6').attr('refX',7).attr('markerWidth',4).attr('markerHeight',4).attr('orient','auto')
    .append('path').attr('d','M0,-3L6,0L0,3').attr('fill','#334155');
  sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>d.derived?120:75).strength(.45))
    .force('charge',d3.forceManyBody().strength(-220))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>(NR[d.type]||5)+10));
  const link=g.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',d=>EC[d.type]||'rgba(99,102,241,.3)')
    .attr('stroke-width',d=>d.derived?1.8:.9)
    .attr('stroke-dasharray',d=>d.derived?'4 3':null)
    .attr('marker-end','url(#arr)');
  const node=g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
    .on('click',(e,d)=>{e.stopPropagation();openDetail(d);});
  node.append('circle').attr('r',d=>NR[d.type]||5).attr('fill',d=>NC[d.type]||'#94a3b8')
    .attr('fill-opacity',.88).attr('stroke','#0f172a').attr('stroke-width',1.5);
  node.filter(d=>d.type==='project'||d.type==='person').append('text')
    .attr('dy',d=>-(NR[d.type]||5)-5).attr('text-anchor','middle')
    .attr('fill','#94a3b8').attr('font-size',9).attr('font-family','DM Sans,sans-serif')
    .attr('pointer-events','none')
    .text(d=>(d.label||'').length>26?d.label.slice(0,26)+'…':d.label);
  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  d3.select(el).on('click',()=>closeDetail());
}

function rG(){if(RAW_NODES.length)buildG();}
window.addEventListener('resize',rG);
function sNF(btn){nf=btn.dataset.nf;document.querySelectorAll('[data-nf]').forEach(b=>b.className='chip'+(b===btn?' '+(NCL[nf]||'an'):''));closeDetail();rG();}
function sEF(btn){ef=btn.dataset.ef;document.querySelectorAll('[data-ef]').forEach(b=>b.className='chip'+(b===btn?' '+(ECL[ef]||'aef'):''));closeDetail();rG();}

function onSearch(q){
  const box=document.getElementById('searchresults');
  if(!q.trim()){box.style.display='none';return;}
  const hits=RAW_NODES.filter(n=>(n.label||'').toLowerCase().includes(q.toLowerCase())).slice(0,10);
  if(!hits.length){box.style.display='none';return;}
  box.innerHTML=hits.map(n=>`<div class="sr-item" onmousedown="selectNode('${n.id}')"><div class="sr-dot" style="background:${NC[n.type]||'#94a3b8'}"></div><div><div class="sr-lbl">${n.label}</div><div class="sr-sub">${n.type}${n.sub?' · '+n.sub:''}</div></div></div>`).join('');
  box.style.display='block';
}
function hideSearch(){document.getElementById('searchresults').style.display='none';}
function selectNode(id){document.getElementById('searchinput').value='';hideSearch();const n=nodeById[id]||RAW_NODES.find(n=>n.id===id);if(n)openDetail(n);}

function openDetail(node){
  const{_maps,_rl,_dv}=window;
  if(!_maps)return;
  document.getElementById('dp-dot').style.background=NC[node.type]||'#94a3b8';
  document.getElementById('dp-type').textContent=node.type;
  document.getElementById('dp-title').textContent=node.label;
  document.getElementById('dp-sub').textContent=node.sub||'';
  const allEdges=[..._rl,..._dv];
  const connected=[];
  allEdges.forEach(e=>{
    const sid=e.source_id||e.sid, tid=e.target_id||e.tid;
    const otherId=sid===node.id?tid:tid===node.id?sid:null;
    if(!otherId)return;
    const eType=e.relation_type||e.edge_type||'';
    const other=RAW_NODES.find(n=>n.id===otherId);
    if(other&&!connected.find(c=>c.id===otherId))connected.push({...other,edgeType:eType});
  });
  const groups={};
  connected.forEach(c=>{(groups[c.type]||(groups[c.type]=[])).push(c);});
  let html='';
  const raw=_maps.projectMap[node.id]||_maps.peopleMap[node.id]||_maps.ideaMap[node.id]||_maps.thoughtMap[node.id];
  if(raw){
    html+='<div class="dp-section"><div class="dp-seclbl">Details</div><div style="display:flex;flex-direction:column;gap:6px">';
    if(raw.status)    html+=`<div style="font-size:11px;color:#475569"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">status</span>${raw.status}</div>`;
    if(raw.entity)    html+=`<div style="font-size:11px;color:#475569"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">entity</span>${raw.entity}</div>`;
    if(raw.category)  html+=`<div style="font-size:11px;color:#475569"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">category</span>${raw.category}</div>`;
    if(raw.company)   html+=`<div style="font-size:11px;color:#475569"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">company</span>${raw.company}</div>`;
    if(raw.role)      html+=`<div style="font-size:11px;color:#475569"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">role</span>${raw.role}</div>`;
    if(raw.content)   html+=`<div style="font-size:11px;color:#475569;line-height:1.5"><span style="color:#94a3b8;font-family:DM Mono,monospace;font-size:9px;display:block">content</span>${(raw.content||'').slice(0,200)}${(raw.content||'').length>200?'…':''}</div>`;
    html+='</div></div>';
  }
  ['project','person','idea','thought'].forEach(t=>{
    if(!groups[t]||!groups[t].length)return;
    html+=`<div class="dp-section"><div class="dp-seclbl">${t}s (${groups[t].length})</div><div class="dp-conn">`;
    groups[t].slice(0,12).forEach(c=>{
      html+=`<div class="dp-connitem" onclick="selectNode('${c.id}')"><div class="dp-conndot" style="background:${NC[c.type]||'#94a3b8'}"></div><div><div class="dp-connlbl">${(c.label||'').length>32?c.label.slice(0,32)+'…':c.label}</div>${c.edgeType?`<div class="dp-connsub">${c.edgeType}</div>`:''}</div></div>`;
    });
    if(groups[t].length>12)html+=`<div class="dp-empty">+${groups[t].length-12} meer</div>`;
    html+='</div></div>';
  });
  if(!connected.length)html+='<div class="dp-empty">Geen verbindingen gevonden</div>';
  document.getElementById('dp-body').innerHTML=html;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){document.getElementById('detail').classList.remove('open');}

let hl=false;
async function loadH(){
  if(hl)return;hl=true;
  const [lr,tc,pc,pec,ic,rc,dc]=await Promise.all([
    sbGet('brain_lint_results','?order=run_at.desc&limit=30'),
    sbCnt('thoughts'),sbCnt('projects'),sbCnt('people'),sbCnt('ideas'),sbCnt('relations'),sbCnt('derived_edges'),
  ]);
  document.getElementById('sg').innerHTML=[['Thoughts',tc,'#16a34a'],['Projects',pc,'#2563eb'],['People',pec,'#dc2626'],['Ideas',ic,'#d97706'],['Relaties',rc,'#7c3aed'],['Derived',dc,'#f59e0b']]
    .map(([l,v,c])=>`<div class="sc"><div class="scl">${l}</div><div class="scv">${v.toLocaleString('nl-NL')}</div><div class="scb" style="background:${c}"></div></div>`).join('');
  if(!lr.length){document.getElementById('lr').textContent='Nog geen run';return;}
  const lat=lr[0].run_at;
  const items=lr.filter(l=>l.run_at===lat).sort((a,b)=>({high:0,medium:1,low:2,info:3}[a.severity]-{high:0,medium:1,low:2,info:3}[b.severity]));
  document.getElementById('lr').textContent=new Date(lat).toLocaleString('nl-NL');
  const hi=items.filter(i=>i.severity==='high').length,mi=items.filter(i=>i.severity==='medium').length;
  document.getElementById('lbg').innerHTML=(hi?`<div class="bg bgh"><div class="bd" style="background:#ef4444"></div>${hi} hoog</div>`:'')+( mi?`<div class="bg bgm"><div class="bd" style="background:#f59e0b"></div>${mi} medium</div>`:'');
  document.getElementById('ll').innerHTML=items.map(i=>`<div class="litem ${i.severity}"><div class="ldot"></div><div class="lb"><div class="lt"><span class="llab">${i.label}</span><span class="lcnt">${(i.count||0).toLocaleString('nl-NL')}</span></div><div class="ldesc">${i.description||''}</div></div></div>`).join('');
}

loadGraph();
