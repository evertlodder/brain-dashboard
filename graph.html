<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain · Graph & Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'DM Sans',sans-serif;background:#f8fafc;color:#0f172a}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 6px #16a34a;animation:pu 2.4s ease-in-out infinite}
  @keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
  small{font-family:'DM Mono',monospace;font-size:10px;color:#94a3b8;display:block}
  .tabs{display:flex;gap:2px;background:#f1f5f9;border-radius:8px;padding:3px}
  .tab{padding:5px 16px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;color:#94a3b8;transition:all .15s}
  .tab.on{background:#fff;color:#0f172a;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .content{flex:1;display:flex;flex-direction:column;min-height:0}
  .panel{display:none;flex:1;flex-direction:column;min-height:0}
  .panel.on{display:flex}
  .gc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:9px 18px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0}
  .fl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
  .chip{padding:3px 9px;border-radius:20px;border:1.5px solid #e2e8f0;background:transparent;color:#94a3b8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
  .an{border-color:#6366f1;background:#eef2ff;color:#4338ca}
  .at{border-color:#16a34a;background:#f0fdf4;color:#16a34a}
  .apr{border-color:#2563eb;background:#eff6ff;color:#2563eb}
  .ape{border-color:#dc2626;background:#fef2f2;color:#dc2626}
  .ai{border-color:#d97706;background:#fffbeb;color:#d97706}
  .aef{border-color:#6366f1;background:#eef2ff;color:#4338ca}
  .app{border-color:#d97706;background:#fffbeb;color:#d97706}
  .aip{border-color:#7c3aed;background:#f5f3ff;color:#7c3aed}
  .sep{width:1px;height:14px;background:#e2e8f0}
  .sb{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:#94a3b8}
  .gw{flex:1;position:relative;min-height:0}
  #gs{position:absolute;inset:0;width:100%;height:100%;background:#0f172a}
  #gl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:'DM Mono',monospace;font-size:11px;color:#475569;z-index:10}
  .leg{position:absolute;bottom:10px;left:12px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
  .li2{display:flex;align-items:center;gap:4px}
  .ld{width:7px;height:7px;border-radius:50%}
  .ll{font-family:'DM Mono',monospace;font-size:9px;color:#64748b}
  #tt{position:fixed;pointer-events:none;opacity:0;background:rgba(255,255,255,.97);border:1px solid #e2e8f0;border-radius:9px;padding:10px 13px;min-width:160px;max-width:220px;transition:opacity .12s;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.1)}
  #tt .ttype{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:flex;align-items:center;gap:5px}
  #tt .tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  #tt .tlbl{font-size:12px;color:#0f172a;font-weight:500;line-height:1.4;margin-bottom:4px}
  #tt .tsub{font-family:'DM Mono',monospace;font-size:10px;color:#94a3b8}
  #panel-health{overflow-y:auto}
  .hi{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .hh{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .hl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
  .hv{font-size:12px;color:#475569}
  .bgs{display:flex;gap:5px}
  .bg{display:flex;align-items:center;gap:4px;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:600}
  .bgh{background:#fef2f2;color:#dc2626}
  .bgm{background:#fffbeb;color:#d97706}
  .bd{width:6px;height:6px;border-radius:50%}
  .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .sc{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:12px 14px}
  .scl{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .scv{font-size:22px;font-weight:700;color:#0f172a;line-height:1}
  .scb{margin-top:6px;height:2px;border-radius:1px}
  .lsh{font-family:'DM Mono',monospace;font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
  .litem{border-radius:9px;padding:11px 13px;display:flex;gap:9px;margin-bottom:5px}
  .ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
  .lb{flex:1}
  .lt{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
  .llab{font-size:12px;font-weight:600}
  .lcnt{font-family:'DM Mono',monospace;font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.06)}
  .ldesc{font-size:11px;opacity:.75;line-height:1.5}
  .litem.high{background:#fef2f2}.litem.high .llab,.litem.high .lcnt,.litem.high .ldesc{color:#dc2626}.litem.high .ldot{background:#ef4444}
  .litem.medium{background:#fffbeb}.litem.medium .llab,.litem.medium .lcnt,.litem.medium .ldesc{color:#d97706}.litem.medium .ldot{background:#f59e0b}
  .litem.low{background:#eff6ff}.litem.low .llab,.litem.low .lcnt,.litem.low .ldesc{color:#2563eb}.litem.low .ldot{background:#3b82f6}
  .litem.info{background:#f0fdf4}.litem.info .llab,.litem.info .lcnt,.litem.info .ldesc{color:#16a34a}.litem.info .ldot{background:#22c55e}
  #errmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0f172a;font-family:'DM Mono',monospace;font-size:11px;color:#ef4444;text-align:center;padding:20px;z-index:10}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="dot"></div><div><h1>Open Brain</h1><small>fzxpmjvx · graph & health</small></div></div>
  <div class="tabs">
    <button class="tab on" onclick="sw('graph',this)">Graph</button>
    <button class="tab"   onclick="sw('health',this)">Health</button>
  </div>
</header>
<div class="content">
  <div class="panel on" id="panel-graph">
    <div class="gc">
      <span class="fl">Nodes</span>
      <button class="chip an"  data-nf="all"     onclick="sNF(this)">Alles</button>
      <button class="chip"     data-nf="thought" onclick="sNF(this)">Thoughts</button>
      <button class="chip"     data-nf="project" onclick="sNF(this)">Projects</button>
      <button class="chip"     data-nf="person"  onclick="sNF(this)">People</button>
      <button class="chip"     data-nf="idea"    onclick="sNF(this)">Ideas</button>
      <div class="sep"></div>
      <span class="fl">Edges</span>
      <button class="chip aef" data-ef="all"            onclick="sEF(this)">Alle</button>
      <button class="chip"     data-ef="spawned_from"   onclick="sEF(this)">spawned→</button>
      <button class="chip"     data-ef="project_person" onclick="sEF(this)">proj→person</button>
      <button class="chip"     data-ef="idea_project"   onclick="sEF(this)">idea→proj</button>
      <span class="sb" id="gstat">laden…</span>
    </div>
    <div class="gw">
      <div id="gl">kennisgraaf laden…</div>
      <div id="errmsg"></div>
      <svg id="gs"></svg>
      <div class="leg">
        <div class="li2"><div class="ld" style="background:#6EE7B7"></div><span class="ll">thought</span></div>
        <div class="li2"><div class="ld" style="background:#93C5FD"></div><span class="ll">project</span></div>
        <div class="li2"><div class="ld" style="background:#FCA5A5"></div><span class="ll">person</span></div>
        <div class="li2"><div class="ld" style="background:#FCD34D"></div><span class="ll">idea</span></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel-health">
    <div class="hi">
      <div class="hh">
        <div><div class="hl">Laatste lint run</div><div class="hv" id="lr">laden…</div></div>
        <div class="bgs" id="lbg"></div>
      </div>
      <div class="sg" id="sg"></div>
      <div><div class="lsh">Bevindingen</div><div id="ll">laden…</div></div>
    </div>
  </div>
</div>
<div id="tt"><div class="ttype"><div class="tdot" id="tdot"></div><span id="ttype"></span></div><div class="tlbl" id="tlbl"></div><div class="tsub" id="tsub"></div></div>
<script>
// ── CONFIG ───────────────────────────────────────────────────────
const SB  = 'https://fzxpmjvxmpeutwyakgyg.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eHBtanZ4bXBldXR3eWFrZ3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2OTAwMDEsImV4cCI6MjA4ODI2NjAwMX0.9rOfzwv6wImlsIrzXaLiZ6ueygAZ4KYYDMtoOtDjPT8';

// Use URL-based auth to avoid CORS header issues
async function sbGet(table, qs=''){
  const url = `${SB}/rest/v1/${table}${qs}${qs.includes('?')?'&':'?'}apikey=${KEY}`;
  const r = await fetch(url);
  if(!r.ok){ console.error('sbGet error', table, r.status, await r.text()); return []; }
  const d = await r.json();
  return Array.isArray(d) ? d : [];
}
async function sbCnt(table, qs=''){
  const d = await sbGet(table, `?select=id${qs}&limit=5000`);
  return d.length;
}

const NC={thought:'#6EE7B7',project:'#93C5FD',person:'#FCA5A5',idea:'#FCD34D'};
const EC={spawned_from:'rgba(99,102,241,.3)',project_person:'rgba(245,158,11,.85)',idea_project:'rgba(167,139,250,.85)'};
const NR={thought:5,project:10,person:8,idea:7};
const NCL={all:'an',thought:'at',project:'apr',person:'ape',idea:'ai'};
const ECL={all:'aef',spawned_from:'aef',project_person:'app',idea_project:'aip'};

let AN=[],AE=[],nf='all',ef='all',sim;

// ── TABS ─────────────────────────────────────────────────────────
function sw(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='graph') setTimeout(rG,50);
  if(id==='health') loadH();
}

// ── GRAPH ─────────────────────────────────────────────────────────
async function loadGraph(){
  try{
    const [pr,pe,id,rl,dv] = await Promise.all([
      sbGet('projects','?select=id,name,status,entity&limit=80'),
      sbGet('people','?select=id,name,company&limit=50'),
      sbGet('ideas','?select=id,title,status&limit=50'),
      sbGet('relations','?select=source_id,source_type,target_id,target_type,relation_type&limit=600'),
      sbGet('derived_edges','?select=source_id,source_type,target_id,target_type,edge_type&limit=200'),
    ]);

    console.log('loaded',pr.length,'projects',pe.length,'people',rl.length,'relations',dv.length,'derived');

    const lids=new Set([...rl.map(r=>r.source_id),...rl.map(r=>r.target_id),...dv.map(d=>d.source_id),...dv.map(d=>d.target_id)]);
    const tids=[...new Set(rl.filter(r=>r.source_type==='thought').map(r=>r.source_id))].slice(0,80);
    const th = tids.length ? await sbGet('thoughts',`?id=in.(${tids.join(',')})&select=id,title,category`) : [];

    AN=[
      ...th.map(t=>({id:t.id,type:'thought',label:t.title||'–',sub:t.category})),
      ...pr.map(p=>({id:p.id,type:'project',label:p.name,sub:p.entity||p.status})),
      ...pe.map(p=>({id:p.id,type:'person', label:p.name,sub:p.company})),
      ...id.map(i=>({id:i.id,type:'idea',  label:i.title,sub:i.status})),
    ].filter(n=>lids.has(n.id)||n.type==='project'||n.type==='person');

    const nids=new Set(AN.map(n=>n.id));
    AE=[
      ...rl.filter(r=>nids.has(r.source_id)&&nids.has(r.target_id)).map(r=>({source:r.source_id,target:r.target_id,type:r.relation_type,derived:false})),
      ...dv.filter(d=>nids.has(d.source_id)&&nids.has(d.target_id)).map(d=>({source:d.source_id,target:d.target_id,type:d.edge_type,derived:true})),
    ];

    console.log('AN=',AN.length,'AE=',AE.length);
    document.getElementById('gl').style.display='none';
    buildG();
  } catch(e){
    console.error('loadGraph error',e);
    const em=document.getElementById('errmsg');
    em.style.display='flex';
    em.textContent='Fout: '+e.message;
  }
}

function fdata(){
  const nodes=nf==='all'?AN:AN.filter(n=>n.type===nf);
  const ids=new Set(nodes.map(n=>n.id));
  const edges=AE.filter(e=>ids.has(e.source)&&ids.has(e.target)&&(ef==='all'||e.type===ef));
  return{nodes,edges};
}

function buildG(){
  const el=document.getElementById('gs');
  const W=el.clientWidth, H=el.clientHeight;
  if(!W||!H){ setTimeout(buildG,150); return; }

  if(sim) sim.stop();
  d3.select(el).selectAll('*').remove();
  const{nodes,edges}=fdata();
  document.getElementById('gstat').textContent=`${nodes.length} nodes · ${edges.length} edges`;

  const root=d3.select(el);
  const g=root.append('g');
  root.call(d3.zoom().scaleExtent([0.1,8]).on('zoom',e=>g.attr('transform',e.transform)));

  root.append('defs').append('marker')
    .attr('id','arr').attr('viewBox','0 -3 6 6').attr('refX',6).attr('markerWidth',4).attr('markerHeight',4).attr('orient','auto')
    .append('path').attr('d','M0,-3L6,0L0,3').attr('fill','#334155');

  sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>d.derived?115:72).strength(.4))
    .force('charge',d3.forceManyBody().strength(-200))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>(NR[d.type]||5)+9));

  const link=g.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',d=>EC[d.type]||'rgba(99,102,241,.25)')
    .attr('stroke-width',d=>d.derived?1.5:.8)
    .attr('stroke-dasharray',d=>d.derived?'4 3':null)
    .attr('marker-end','url(#arr)');

  const node=g.append('g').selectAll('g').data(nodes).join('g').attr('cursor','pointer')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on('drag', (e,d)=>{d.fx=e.x;d.fy=e.y})
      .on('end',  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}))
    .on('mouseover',showTT).on('mousemove',movTT).on('mouseout',hidTT);

  node.append('circle')
    .attr('r',d=>NR[d.type]||5)
    .attr('fill',d=>NC[d.type]||'#94a3b8')
    .attr('fill-opacity',.88)
    .attr('stroke','#0f172a').attr('stroke-width',1.5);

  node.filter(d=>d.type==='project'||d.type==='person').append('text')
    .attr('dy',d=>-(NR[d.type]||5)-5).attr('text-anchor','middle')
    .attr('fill','#94a3b8').attr('font-size',9).attr('font-family','DM Sans,sans-serif')
    .attr('pointer-events','none')
    .text(d=>(d.label||'').length>24?d.label.slice(0,24)+'…':d.label);

  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function rG(){ if(AN.length) buildG(); }
window.addEventListener('resize',rG);

function sNF(btn){
  nf=btn.dataset.nf;
  document.querySelectorAll('[data-nf]').forEach(b=>b.className='chip'+(b===btn?' '+(NCL[nf]||'an'):''));
  if(AN.length)buildG();
}
function sEF(btn){
  ef=btn.dataset.ef;
  document.querySelectorAll('[data-ef]').forEach(b=>b.className='chip'+(b===btn?' '+(ECL[ef]||'aef'):''));
  if(AN.length)buildG();
}

const ttEl=document.getElementById('tt');
function showTT(e,d){
  document.getElementById('tdot').style.background=NC[d.type]||'#94a3b8';
  document.getElementById('ttype').textContent=d.type;
  document.getElementById('tlbl').textContent=d.label;
  document.getElementById('tsub').textContent=d.sub||'';
  ttEl.style.opacity=1; movTT(e);
}
function movTT(e){ ttEl.style.left=(e.clientX+14)+'px'; ttEl.style.top=(e.clientY-10)+'px'; }
function hidTT(){ ttEl.style.opacity=0; }

// ── HEALTH ────────────────────────────────────────────────────────
let hl=false;
async function loadH(){
  if(hl)return; hl=true;
  const [lr,tc,pc,pec,ic,rc,dc]=await Promise.all([
    sbGet('brain_lint_results','?order=run_at.desc&limit=30'),
    sbCnt('thoughts'), sbCnt('projects'), sbCnt('people'),
    sbCnt('ideas'), sbCnt('relations'), sbCnt('derived_edges'),
  ]);

  document.getElementById('sg').innerHTML=
    [['Thoughts',tc,'#16a34a'],['Projects',pc,'#2563eb'],['People',pec,'#dc2626'],
     ['Ideas',ic,'#d97706'],['Relaties',rc,'#7c3aed'],['Derived',dc,'#f59e0b']]
    .map(([l,v,c])=>`<div class="sc"><div class="scl">${l}</div><div class="scv">${v.toLocaleString('nl-NL')}</div><div class="scb" style="background:${c}"></div></div>`).join('');

  if(!lr.length){ document.getElementById('lr').textContent='Nog geen run'; return; }
  const lat=lr[0].run_at;
  const items=lr.filter(l=>l.run_at===lat).sort((a,b)=>({high:0,medium:1,low:2,info:3}[a.severity]-{high:0,medium:1,low:2,info:3}[b.severity]));
  document.getElementById('lr').textContent=new Date(lat).toLocaleString('nl-NL');

  const hi=items.filter(i=>i.severity==='high').length, mi=items.filter(i=>i.severity==='medium').length;
  document.getElementById('lbg').innerHTML=
    (hi?`<div class="bg bgh"><div class="bd" style="background:#ef4444"></div>${hi} hoog</div>`:'')
   +(mi?`<div class="bg bgm"><div class="bd" style="background:#f59e0b"></div>${mi} medium</div>`:'');

  document.getElementById('ll').innerHTML=items.map(i=>`
    <div class="litem ${i.severity}">
      <div class="ldot"></div>
      <div class="lb">
        <div class="lt"><span class="llab">${i.label}</span><span class="lcnt">${(i.count||0).toLocaleString('nl-NL')}</span></div>
        <div class="ldesc">${i.description||''}</div>
      </div>
    </div>`).join('');
}

// ── START ─────────────────────────────────────────────────────────
loadGraph();
</script>
</body>
</html>
